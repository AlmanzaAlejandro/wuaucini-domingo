<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>¿Quieres ser mi novia? 💍</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; width: 100%; }

    body {
      min-height: 100svh;
      background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 40%, #1a0a2e 100%);
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--d) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.2; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.5); }
    }

    .heart-float {
      position: fixed;
      bottom: -60px;
      font-size: 1.6rem;
      animation: floatUp var(--dur) linear infinite;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg);   opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      padding: 48px 44px 40px;
      max-width: 500px;
      width: 92vw;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      animation: cardIn 1s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.7) translateY(40px); }
      to   { opacity: 1; transform: scale(1)   translateY(0); }
    }

    .ring {
      font-size: 4rem;
      display: block;
      margin-bottom: 12px;
      animation: swing 2.5s ease-in-out infinite;
    }
    @keyframes swing {
      0%,100% { transform: rotate(-8deg); }
      50%      { transform: rotate(8deg); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 7vw, 2.3rem);
      color: #fff;
      line-height: 1.3;
      margin-bottom: 10px;
    }
    h1 em { color: #f9a8d4; font-style: italic; }

    .subtitle {
      color: rgba(255,255,255,0.65);
      font-size: clamp(0.88rem, 4vw, 1rem);
      line-height: 1.7;
      margin: 18px 0 30px;
    }
    .subtitle strong { color: #f9a8d4; font-weight: 400; font-style: italic; }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-direction: column;
      align-items: center;
    }

    .btn {
      position: relative;
      width: 100%;
      max-width: 280px;
      padding: 18px 36px;
      border: none;
      border-radius: 999px;
      font-size: clamp(1rem, 4vw, 1.1rem);
      font-family: 'Lato', sans-serif;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.3s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.96) !important; }

    .btn-yes {
      background: linear-gradient(135deg, #ec4899, #a855f7);
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.03em;
      box-shadow: 0 6px 30px rgba(236,72,153,0.45);
    }
    .btn-yes:hover { transform: scale(1.05); box-shadow: 0 10px 40px rgba(236,72,153,0.65); }

    .btn-no {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-no:hover { background: rgba(255,255,255,0.15); }

    /* pantalla sí */
    #yesScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #yesScreen .big {
      font-size: clamp(3.5rem, 14vw, 5rem);
      animation: bounce 0.55s ease infinite alternate;
    }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-16px); } }
    #yesScreen h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 7vw, 2rem);
      color: #fff;
      line-height: 1.4;
    }
    #yesScreen p { color: rgba(255,255,255,0.7); font-size: clamp(0.9rem, 4vw, 1rem); margin-bottom: 0; }
    #yesScreen p strong { color: #f9a8d4; font-style: italic; font-weight: 400; }

    .confetti-piece {
      position: fixed;
      width: 10px; height: 10px;
      border-radius: 2px;
      top: -12px;
      animation: confettiFall var(--cd) linear forwards;
      pointer-events: none;
      z-index: 20;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg) translateX(var(--cx)); opacity: 0; }
    }

    @media (max-width: 380px) {
      .card { padding: 36px 22px 30px; border-radius: 20px; }
    }
  </style>
</head>
<body>
<script>
  if (localStorage.getItem('wau_auth') !== 'ok') {
    window.location.replace('index.html?next=novia.html');
  }
</script>

<div id="stars"></div>
<div id="hearts"></div>

<div class="card">

  <div id="askView">
    <span class="ring">💍</span>
    <h1><em>Wuaucini</em>,<br>¿Quieres ser<br>mi novia?</h1>
    <p class="subtitle">
      Ya pasamos por tanto juntos.<br>
      Cada momento contigo me confirma<br>
      que quiero que seas mía de verdad.<br>
      <strong>Te amo con todo.</strong>
    </p>
    <div class="buttons">
      <button class="btn btn-yes" id="yesBtn">¡Sí, quiero! 💜</button>
      <button class="btn btn-no"  id="noBtn">Mmm… no sé</button>
    </div>
  </div>

  <div id="yesScreen">
    <span class="big">💍</span>
    <h2>¡Eres mi novia!</h2>
    <p>Eres la persona más bonita<br>que ha pasado por mi vida.<br><strong>Te amo, mi Wuaucini 🥰</strong></p>
  </div>

</div>

<script>
  /* estrellas */
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 130; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = 1 + Math.random() * 2.2;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*6}s;`;
    starsEl.appendChild(s);
  }

  /* corazones */
  const heartsEl = document.getElementById('hearts');
  ['❤️','🩷','💜','🤍','✨','💕','🌸','💍'].forEach(e => {
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = e;
    h.style.cssText = `left:${Math.random()*100}%;--dur:${7+Math.random()*9}s;animation-delay:${Math.random()*11}s;`;
    heartsEl.appendChild(h);
  });

  /* botón No — huye en desktop, se encoge en móvil */
  const noBtn = document.getElementById('noBtn');
  const isTouch = () => window.matchMedia('(pointer: coarse)').matches;

  noBtn.addEventListener('mouseover', () => { if (!isTouch()) escape(); });

  let tapCount = 0;
  const tapLabels = ['Mmm… no sé', 'Piénsalo bien…', 'Ya casi dices que sí…', '¡Dijiste que sí! 😏'];
  noBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    tapCount++;
    const scale = Math.max(0, 1 - tapCount * 0.22);
    noBtn.style.transform = `scale(${scale})`;
    noBtn.style.opacity = String(Math.max(0, 1 - tapCount * 0.25));
    if (tapCount < tapLabels.length) noBtn.textContent = tapLabels[tapCount];
    if (tapCount >= 4) noBtn.style.pointerEvents = 'none';
  }, { passive: false });

  let escapedTimes = 0;
  function escape() {
    escapedTimes++;
    const vw = window.innerWidth, vh = window.innerHeight;
    const rect = noBtn.getBoundingClientRect();
    let nx, ny, tries = 0;
    do {
      nx = Math.random() * (vw - rect.width);
      ny = Math.random() * (vh - rect.height);
      tries++;
    } while (tries < 20 && Math.abs(nx - rect.left) < 150 && Math.abs(ny - rect.top) < 100);
    noBtn.style.position = 'fixed';
    noBtn.style.left = nx + 'px';
    noBtn.style.top  = ny + 'px';
    noBtn.style.zIndex = '50';
    if (escapedTimes >= 3) noBtn.textContent = '¡Dijiste que sí! 😏';
    if (escapedTimes >= 5) noBtn.style.opacity = '0';
  }

  /* botón Sí */
  document.getElementById('yesBtn').addEventListener('click', () => {
    document.getElementById('askView').style.display = 'none';
    const ys = document.getElementById('yesScreen');
    ys.style.display = 'flex';
    noBtn.style.display = 'none';
    launchConfetti();
    setTimeout(launchConfetti, 1200);
    setTimeout(launchConfetti, 2400);
  });

  function launchConfetti() {
    const colors = ['#f472b6','#a78bfa','#34d399','#fbbf24','#60a5fa','#fb7185','#c084fc'];
    for (let i = 0; i < 150; i++) {
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      c.style.cssText = `
        left:${Math.random()*100}vw;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        --cd:${1.4+Math.random()*2.8}s;
        --cx:${(Math.random()-0.5)*240}px;
        animation-delay:${Math.random()*0.9}s;
        border-radius:${Math.random()>0.5?'50%':'2px'};
        width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;
      `;
      document.body.appendChild(c);
      c.addEventListener('animationend', () => c.remove());
    }
  }
</script>
</body>
</html>
