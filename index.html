<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Acceso privado 🔒</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }

    body {
      min-height: 100svh;
      background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 40%, #1a0a2e 100%);
      font-family: 'Lato', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--d) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.15; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.5); }
    }

    .heart-float {
      position: fixed;
      bottom: -60px;
      font-size: 1.4rem;
      animation: floatUp var(--dur) linear infinite;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0); opacity: 0; }
      10%  { opacity: 0.55; }
      90%  { opacity: 0.25; }
      100% { transform: translateY(-110vh) rotate(15deg); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      padding: 48px 40px 40px;
      max-width: 420px;
      width: 92vw;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      animation: cardIn 0.85s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.75) translateY(40px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }

    .lock {
      font-size: 3rem;
      display: block;
      margin-bottom: 14px;
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 6vw, 1.9rem);
      color: #fff;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    h1 em { color: #f9a8d4; font-style: italic; }

    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 0.88rem;
      margin-bottom: 30px;
      letter-spacing: 0.02em;
    }

    .field {
      margin-bottom: 16px;
      text-align: left;
    }
    .field label {
      display: block;
      color: rgba(255,255,255,0.6);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      color: #fff;
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .field input::placeholder { color: rgba(255,255,255,0.3); }
    .field input:focus {
      border-color: #ec4899;
      background: rgba(255,255,255,0.12);
    }

    .error-msg {
      color: #fb7185;
      font-size: 0.82rem;
      margin-bottom: 14px;
      min-height: 1.2em;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .error-msg.show { opacity: 1; }

    .btn-enter {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ec4899, #a855f7);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 6px 28px rgba(236,72,153,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-enter:hover { transform: scale(1.03); box-shadow: 0 10px 36px rgba(236,72,153,0.6); }
    .btn-enter:active { transform: scale(0.97); }
  </style>
</head>
<body>

<div id="stars"></div>
<div id="hearts"></div>

<div class="card">
  <span class="lock">🔒</span>
  <h1>Zona <em>privada</em></h1>
  <p class="subtitle">Solo para personas especiales</p>

  <form id="loginForm">
    <div class="field">
      <label>Usuario</label>
      <input type="text" id="userInput" placeholder="¿Quién eres?" autocomplete="off" autocapitalize="none" spellcheck="false" />
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="passInput" placeholder="••••••••••" autocomplete="off" />
    </div>
    <p class="error-msg" id="errorMsg">Usuario o contraseña incorrectos</p>
    <button type="submit" class="btn-enter">Entrar 💜</button>
  </form>
</div>

<script>
  /* estrellas */
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = 1 + Math.random() * 2;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*6}s;`;
    starsEl.appendChild(s);
  }

  /* corazones */
  const heartsEl = document.getElementById('hearts');
  ['❤️','🩷','💜','✨','💕','🌸'].forEach(e => {
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = e;
    h.style.cssText = `left:${Math.random()*100}%;--dur:${8+Math.random()*9}s;animation-delay:${Math.random()*12}s;`;
    heartsEl.appendChild(h);
  });

  /* login */
  const CORRECT_USER = 'Wau';
  const CORRECT_PASS = '31-05-2026';

  const params  = new URLSearchParams(window.location.search);
  const nextPage = params.get('next') || 'nosotros.html';

  /* si ya está autenticada, redirige directo */
  if (localStorage.getItem('wau_auth') === 'ok') {
    window.location.replace(nextPage);
  }

  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const user = document.getElementById('userInput').value.trim();
    const pass = document.getElementById('passInput').value;
    const errEl = document.getElementById('errorMsg');

    if (user === CORRECT_USER && pass === CORRECT_PASS) {
      localStorage.setItem('wau_auth', 'ok');
      window.location.replace(nextPage);
    } else {
      errEl.classList.add('show');
      document.getElementById('passInput').value = '';
      setTimeout(() => errEl.classList.remove('show'), 3000);
    }
  });
</script>
</body>
</html>
